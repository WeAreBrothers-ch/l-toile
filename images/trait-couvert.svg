<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 260 190"
  fill="none"
  stroke="#a5937c"
  stroke-width="1.6"
  stroke-linecap="round"
  stroke-linejoin="round"
  role="img"
  aria-label="Dessin au trait d’un couvert dressé : une assiette, une fourchette et un couteau"
>
  <!-- L'assiette, vue de dessus. Les deux cercles ne sont pas tout à fait
       concentriques et le bord n'est pas tout à fait rond : une assiette
       parfaite se lit comme un pictogramme, pas comme un dessin. -->
  <path
    d="M130 40c30 0 55 22 55 51s-25 51-55 51-56-22-56-51 26-51 56-51Z"
  />
  <path
    d="M130 58c21 0 38 15 38 33s-17 33-38 33-38-15-38-33 17-33 38-33Z"
  />

  <!-- La fourchette : trois dents, un col qui les rassemble, un manche qui
       s'affine. -->
  <path d="M40 34v26 M51 33v27 M62 34v26" />
  <path d="M40 60c0 9 5 14 11 14s11-5 11-14" />
  <path d="M51 74c1 26 1 52 0 78" />

  <!-- Le couteau. Le dos est droit, le tranchant est courbe : c'est cette
       dissymétrie qui fait lire un couteau plutôt qu'une feuille. -->
  <path d="M221 32v62c-11-4-17-15-17-28 0-14 6-27 17-34Z" />
  <path d="M218 94c1 19 1 38 0 56" />
</svg>
