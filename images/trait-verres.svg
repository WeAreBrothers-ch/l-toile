<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 260 190"
  fill="none"
  stroke="#a5937c"
  stroke-width="1.6"
  stroke-linecap="round"
  stroke-linejoin="round"
  role="img"
  aria-label="Dessin au trait d’une carafe et de deux verres à vin"
>
  <!-- La carafe. Un goulot droit, une panse qui s'évase franchement. -->
  <path d="M118 26h24" />
  <path
    d="M121 26v22c0 10-19 18-19 38 0 22 14 34 28 34s28-12 28-34c0-20-19-28-19-38V26"
  />
  <!-- Le niveau du vin, en creux. -->
  <path d="M104 82c7 5 14 7 26 7s19-2 26-7" />

  <!-- Le verre de gauche : une coupe ronde, un pied fin, une base légèrement
       incurvée. Rien de symétrique. -->
  <path d="M26 46h44" />
  <path d="M27 46c0 24 9 37 21 39 12-2 21-15 21-39" />
  <path d="M48 85c1 13 1 26 0 38" />
  <path d="M34 124c9-2 19-2 28 0" />

  <!-- Le verre de droite, posé plus haut : deux objets identiques à la même
       hauteur font un motif, pas une table. -->
  <path d="M190 34h44" />
  <path d="M191 34c0 24 9 37 21 39 12-2 21-15 21-39" />
  <path d="M212 73c1 13 1 26 0 38" />
  <path d="M198 112c9-2 19-2 28 0" />
