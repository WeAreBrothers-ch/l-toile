# Publie le site sur GitHub Pages, à chaque envoi sur `main`.
#
# À activer une fois dans le dépôt : Settings → Pages → Source → **GitHub Actions**.
# (Et non « Deploy from a branch » : c'est ce réglage-là qui faisait afficher le
# README à la place du site, parce que Pages retombait alors sur Jekyll.)
#
# Le site est servi sous https://wearebrothers-ch.github.io/l-toile/ , donc dans
# un sous-dossier : d'où `NEXT_PUBLIC_BASE_PATH`. Sur le domaine du restaurant,
# cette variable n'existe pas et le site vit à la racine.
name: Aperçu GitHub Pages

on:
  push:
    branches: [main]
  # Permet aussi de republier à la main depuis l'onglet Actions.
  workflow_dispatch:

# Le jeton ne sert qu'à publier les pages, rien d'autre.
permissions:
  contents: read
  pages: write
  id-token: write

# Une publication à la fois ; une nouvelle attend la fin de la précédente
# plutôt que de l'interrompre à mi-chemin.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Construire le site
        env:
          NEXT_PUBLIC_BASE_PATH: /l-toile
          # Adresse du service de réception du formulaire de contact. Tant
          # qu'elle est vide, le formulaire l'annonce et renvoie vers le
          # téléphone — il n'avale jamais un message en silence.
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}
        run: npm run build

      # Sans ce fichier, Pages ignore les dossiers commençant par un souligné —
      # dont `_next/`, qui contient toutes les feuilles de style et les scripts.
      # Le site s'afficherait sans aucune mise en forme.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4
