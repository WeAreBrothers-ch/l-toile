# ────────────────────────────────────────────────────────────────
# Déploiement automatique du site sur l'hébergement Infomaniak.
#
# Chaque push sur `main` envoie les fichiers modifiés par FTPS.
# L'action garde un fichier d'état (.ftp-deploy-sync-state.json) à la
# racine du dossier distant : seuls les fichiers réellement changés
# sont transférés lors des déploiements suivants.
#
# Secrets à créer dans GitHub (Settings → Secrets and variables → Actions) :
#   FTP_SERVER    ex. xyzb.ftp.infomaniak.com
#   FTP_USERNAME  ex. xyzb_letoile
#   FTP_PASSWORD  le mot de passe du compte FTP
# ────────────────────────────────────────────────────────────────
name: Déployer sur Infomaniak

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation : teste la connexion sans rien écrire sur le serveur"
        type: boolean
        default: false
      table_rase:
        description: "DESTRUCTIF — vide le dossier distant avant l'envoi. Pour la bascule WordPress → nouveau site, une seule fois, après sauvegarde."
        type: boolean
        default: false

# Un seul déploiement à la fois : deux transferts FTP simultanés
# corrompraient le fichier d'état côté serveur.
concurrency:
  group: deploiement-ftp
  cancel-in-progress: false

env:
  # Racine du site, vérifiée dans le Manager Infomaniak :
  # Hébergement → Site → Avancé → « Emplacement du site » = /web/wordpress
  # Ce n'est pas /web/ — le dossier a gardé le nom de l'ancien WordPress
  # qui occupait cette place. Si vous changez l'emplacement dans le
  # Manager un jour, changez aussi cette ligne, sinon le site ne bougera
  # plus quand vous pusherez.
  DOSSIER_DISTANT: /web/wordpress/

jobs:
  deployer:
    name: Transfert FTPS
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier que les trois secrets sont configurés
        env:
          SERVEUR: ${{ secrets.FTP_SERVER }}
          UTILISATEUR: ${{ secrets.FTP_USERNAME }}
          MOT_DE_PASSE: ${{ secrets.FTP_PASSWORD }}
        run: |
          manquants=""
          if [ -z "$SERVEUR" ]; then manquants="$manquants FTP_SERVER"; fi
          if [ -z "$UTILISATEUR" ]; then manquants="$manquants FTP_USERNAME"; fi
          if [ -z "$MOT_DE_PASSE" ]; then manquants="$manquants FTP_PASSWORD"; fi
          if [ -n "$manquants" ]; then
            echo "::error::Secret(s) manquant(s) :$manquants"
            echo "Créez-les dans Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          echo "Les trois secrets sont présents."

      - name: Avertir en cas de table rase
        if: ${{ inputs.table_rase == true }}
        run: |
          echo "::warning::Table rase demandée : tout le contenu de ${{ env.DOSSIER_DISTANT }} sera supprimé avant l'envoi."
          echo "Assurez-vous qu'une sauvegarde Infomaniak récente existe (fichiers ET base de données)."

      - name: Envoyer les fichiers
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps        # FTP sur TLS explicite, port 21
          port: 21
          server-dir: ${{ env.DOSSIER_DISTANT }}
          local-dir: ./
          dry-run: ${{ inputs.dry_run == true }}
          # Jamais actif sur un push : uniquement quand la case est cochée
          # lors d'un lancement manuel.
          dangerous-clean-slate: ${{ inputs.table_rase == true }}
          # Fichiers de travail qui ne doivent pas se retrouver en ligne.
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            **/node_modules/**
            photos-source/**
            scripts/**
            *.md
            planche-da.html
            .nojekyll
